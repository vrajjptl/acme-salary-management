spring.application.name=acme-compensation
server.port=8080
server.servlet.session.cookie.name=ACME_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

spring.datasource.url=jdbc:sqlite:./data/acme-salary.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false

app.seed.enabled=true
app.seed.employees=10000
app.business-date=
app.demo.username=hr.manager
app.demo.password=Hr-Manager-Demo-2026!
app.auth.max-failures=8
app.auth.window-seconds=300
app.cors.allowed-origins=http://localhost:5173

logging.level.org.springframework.jdbc.core=WARN
logging.level.org.springframework.security=INFO
